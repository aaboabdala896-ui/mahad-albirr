name: Apply feature patch
on:
  push:
    branches: [features/notifications-attendance-announcements]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/run-features.py
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx sw.js scripts/apply-features.py scripts/run-features.py
          git diff --cached --quiet || git commit -m 'Add announcements attendance and push UI'
          git push
